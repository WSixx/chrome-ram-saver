name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Extract version from tag (e.g. v1.0.0 → 1.0.0)
      # -----------------------------------------------------------------------
      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Validate manifest version matches the tag
      # -----------------------------------------------------------------------
      - name: Validate manifest version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          TAG_VERSION="${{ steps.version.outputs.VERSION }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Versions match: $MANIFEST_VERSION"

      # -----------------------------------------------------------------------
      # 3.5 Setup Node.js
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # -----------------------------------------------------------------------
      # 4. Package the extension (exclude dev-only files)
      # -----------------------------------------------------------------------
      - name: Package extension zip
        run: |
          ZIP_NAME="ram-saver-${{ github.ref_name }}.zip"
          zip -r "$ZIP_NAME" . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "tests/*" \
            --exclude "scripts/*" \
            --exclude "coverage/*" \
            --exclude "playwright-report/*" \
            --exclude "*.tmp*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "jest.config.js" \
            --exclude "playwright.config.js" \
            --exclude "generate-icons.ps1" \
            --exclude "*.md"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "📦 Created $ZIP_NAME"
          unzip -l "$ZIP_NAME"

      # -----------------------------------------------------------------------
      # 5. Extract changelog notes for this version
      # -----------------------------------------------------------------------
      - name: Extract changelog notes
        id: changelog
        run: node scripts/extract-changelog.js "${{ steps.version.outputs.VERSION }}"

      # -----------------------------------------------------------------------
      # 6. Create GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RAM Saver ${{ github.ref_name }}"
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            ---
            📦 **Installation**: Download `${{ env.ZIP_NAME }}` below and load it as an unpacked extension via `chrome://extensions` (Developer Mode).

            🛒 _Chrome Web Store submission coming soon._
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
