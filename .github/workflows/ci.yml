name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Esteira de Validação: Linting e Testes Unitários
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (Code Quality & Bug Prevention)
        run: npm run lint

      - name: Run Unit Tests (Logic, Manifest & i18n Parity)
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # Criação automática de Tag & Release após sucesso dos testes na main
  # ---------------------------------------------------------------------------
  auto-release:
    name: Auto Tag & Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version & existing tag
        id: check_version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git fetch --tags
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Tag $TAG already exists. Skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✨ New version detected: $TAG! Proceeding with auto-tag and release."
          fi

      - name: Setup Node.js for Packaging & Changelog
        if: steps.check_version.outputs.exists == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Package extension zip & Calculate SHA-256
        if: steps.check_version.outputs.exists == 'false'
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          ZIP_NAME="ram-saver-$TAG.zip"
          zip -r "$ZIP_NAME" . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude "tests/*" \
            --exclude "scripts/*" \
            --exclude "coverage/*" \
            --exclude "playwright-report/*" \
            --exclude "*.tmp*" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "jest.config.js" \
            --exclude "playwright.config.js" \
            --exclude "generate-icons.ps1" \
            --exclude "*.md"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "ZIP_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "📦 Created $ZIP_NAME (SHA-256: $SHA256)"
          unzip -l "$ZIP_NAME"

      - name: Extract changelog notes
        if: steps.check_version.outputs.exists == 'false'
        id: changelog
        run: node scripts/extract-changelog.js "${{ steps.check_version.outputs.version }}"

      - name: Create Git Tag and GitHub Release
        if: steps.check_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: "RAM Saver ${{ steps.check_version.outputs.tag }}"
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---
            📦 **Installation**: Download `${{ env.ZIP_NAME }}` below and load it as an unpacked extension via `chrome://extensions` (Developer Mode).

            🔒 **Integrity**: `sha256: ${{ env.ZIP_SHA256 }}`

            🛒 _Chrome Web Store submission coming soon._
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
